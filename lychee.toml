# Link checking with lychee (https://lychee.cli.rs), on the built site in .vercel/output/static.
# - Pull requests check internal links offline, anchors included: the Links job in .github/workflows/integration.yml.
# - Every Monday, external links too: the Links job in .github/workflows/weekly.yml, which keeps one issue up to date.

index_files = ["index.html"]
include_fragments = "anchor-only"
no_progress = true

# External links: patient, and a rate limit is not a dead link.
max_concurrency = 16
timeout = 20
max_retries = 2
accept = ["200..=299", "429"]
# No browser user agent: Anubis, the bot wall of many open source hosts (invent.kde.org), challenges any "Mozilla" one.

# Examples of local servers (like Ollama's http://localhost:11434) are not links to check.
exclude_loopback = true

exclude = [
  # The site itself: internal links are checked offline on every pull request.
  '^https://openresource\.dev/',
  # Its spec items get their ids from JavaScript, so lychee cannot find the fragment (checked in a browser, 2026-09-28).
  '^https://semver\.org/#spec-item-',
  # Alive, but they answer bots with a login wall or a challenge (checked in a browser, 2026-09-26).
  '^https://(www\.)?linkedin\.com/',
  '^https://(www\.)?(x|twitter)\.com/',
  '^https://(www\.)?openhub\.net/',
  '^https://moodle\.org/',
  '^https://(www\.)?mysql\.com/',
  '^https://(www\.)?figma\.com/',
  # Alive, but a Cloudflare (or similar) bot wall answers scripted requests with a 403 (checked in a browser, 2026-09-28).
  '^https://(www\.)?canva\.com/',
  '^https://support\.discord\.com/',
  '^https://codepen\.io/',
  '^https://(www\.)?(indiegogo|kickstarter|patreon)\.com/',
  '^https://(www\.)?reddit\.com/',
  '^https://(www\.)?npmjs\.com/',
  '^https://sourceforge\.net/',
  '^https://(www\.)?courtlistener\.com/',
  '^https://(www\.)?euipo\.europa\.eu/',
  # Cloudflare challenge on scripted requests (403 with cf-mitigated: challenge), alive in a browser (checked 2026-10-05).
  '^https://(www\.)?stackoverflow\.com/',
  '^https://dl\.acm\.org/',
  # Answers scripted requests with a 403; the Wayback Machine captured its pages alive in September 2026.
  '^https://(www\.)?gnu\.org/',
  # Alive (curl reaches it), but its TLS setup fails lychee's handshake.
  '^https://(www\.)?fsf\.org/',
]
